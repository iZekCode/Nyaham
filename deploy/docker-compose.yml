# Deploy the bot with:  docker compose -f deploy/docker-compose.yml up -d --build
# Run from the repo root so the build context (.) is the project.

# Project name — otherwise it defaults to the folder ("deploy"), which is what
# names the network/group. Sets the compose project to "nyaham".
name: nyaham

services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nyaham-bot:latest
    container_name: nyaham-bot
    restart: unless-stopped        # auto-restart on crash / reboot (§8.2)
    # PTB may be mid getUpdates long-poll when SIGTERM lands; give it room to
    # shut down gracefully (and send the "Bot stopped" notice) before SIGKILL.
    stop_grace_period: 30s
    env_file:
      - ../.env                    # BOT_TOKEN, ADMIN_CHAT_ID (never committed)
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ../data:/app/data          # SQLite cache persists across restarts
      - ../logs:/app/logs          # rotating logs on the host
    # A single polling instance only — never scale >1 (Telegram 409 Conflict).
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
